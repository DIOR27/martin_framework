[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "martin"
version = "0.1.0"
description = "MARTIN Web Framework"
authors = [
    { name="Diego", email="you@example.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["martin*"]

[project.scripts]
martin = "martin.cli.main:cli"